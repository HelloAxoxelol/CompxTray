name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The tag without its "v" on a release, otherwise a development version.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.1.0-dev' }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework compiler
        shell: cmd
        run: build.bat --ci

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin/CompxTray.exe -Algorithm SHA256).Hash
          "$h  CompxTray.exe" | Out-File -Encoding ascii bin/CompxTray.exe.sha256
          Write-Host "SHA-256: $h"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CompxTray-windows
          path: |
            bin/CompxTray.exe
            bin/CompxTray.exe.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        run: sh cross/linux/package.sh linux-x64 "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CompxTray-linux-x64
          path: |
            out/CompxTray-linux-x64.tar.gz
            out/CompxTray-linux-x64.tar.gz.sha256

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        run: sh cross/macos/package.sh ${{ matrix.rid }} "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CompxTray-${{ matrix.rid }}
          path: |
            out/CompxTray-${{ matrix.rid }}.zip
            out/CompxTray-${{ matrix.rid }}.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
