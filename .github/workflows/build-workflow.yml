name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework compiler
        shell: cmd
        run: build.bat --ci

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin/CompxTray.exe -Algorithm SHA256).Hash
          "$h  CompxTray.exe" | Out-File -Encoding ascii bin/CompxTray.exe.sha256
          Write-Host "SHA-256: $h"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CompxTray
          path: |
            bin/CompxTray.exe
            bin/CompxTray.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/CompxTray.exe
            bin/CompxTray.exe.sha256
          generate_release_notes: true
